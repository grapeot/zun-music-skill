[project]
name = "zun-music-skill"
version = "0.1.0"
description = "Agent skill + toolkit for arranging public-domain melodies in the style of ZUN (Touhou Project) as MIDI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["mido>=1.3"]

[project.optional-dependencies]
video = ["numpy>=1.21", "Pillow>=9"]
dev = ["pytest>=8", "numpy>=1.21", "Pillow>=9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
